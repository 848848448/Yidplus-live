name = "yidplus-live"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# ── D1 database (create it once, then paste its id below) ──
#   npx wrangler d1 create yidplus-analytics
# copy the "database_id" it prints into database_id here.
[[d1_databases]]
binding = "DB"
database_name = "yidplus-analytics"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# DASH_KEY (the dashboard password) is a SECRET — do not put it here.
# Set it in the Cloudflare dashboard: Settings → Variables and Secrets → add
# DASH_KEY, or:  npx wrangler pages secret put DASH_KEY
