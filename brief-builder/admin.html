<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief Builder — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fb;--card:#fff;--border:#e2e5ea;--text:#1a1d23;--muted:#6b7280;
  --primary:#2563eb;--primary-hover:#1d4ed8;--primary-light:#dbeafe;
  --success:#059669;--success-bg:#d1fae5;--warn:#d97706;--warn-bg:#fef3c7;
  --error:#dc2626;--error-bg:#fee2e2;--info:#2563eb;--info-bg:#dbeafe;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1117;--card:#1a1d27;--border:#2d3140;--text:#e5e7eb;--muted:#9ca3af;
  --primary:#3b82f6;--primary-hover:#2563eb;--primary-light:#1e3a5f;
  --success:#10b981;--success-bg:#064e3b;--warn:#f59e0b;--warn-bg:#78350f;
  --error:#ef4444;--error-bg:#7f1d1d;--info:#3b82f6;--info-bg:#1e3a5f;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow)}
.login-card h1{font-size:1.5rem;margin-bottom:8px}
.login-card p{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.login-card input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--bg);color:var(--text);margin-bottom:16px}
.login-card input:focus{outline:none;border-color:var(--primary)}

/* Layout */
.app{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar h1{font-size:1.25rem}
.topbar .actions{display:flex;gap:8px;align-items:center}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow)}
.stat .num{font-size:2rem;font-weight:700;line-height:1}
.stat .label{color:var(--muted);font-size:.85rem;margin-top:4px}

/* Buttons */
.btn{padding:10px 20px;border-radius:8px;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-sm{padding:6px 14px;font-size:.8rem}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-danger{background:var(--error);color:#fff}
.btn-danger:hover{opacity:.9}

/* Pills */
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pill-draft{background:var(--border);color:var(--muted)}
.pill-submitted{background:var(--info-bg);color:var(--info)}
.pill-reviewing{background:var(--warn-bg);color:var(--warn)}
.pill-building{background:var(--primary-light);color:var(--primary)}
.pill-client_review{background:var(--warn-bg);color:var(--warn)}
.pill-ready{background:var(--success-bg);color:var(--success)}
.pill-archived{background:var(--border);color:var(--muted)}

/* Brief list */
.brief-list{display:flex;flex-direction:column;gap:12px}
.brief-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.brief-row:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(37,99,235,.1)}
.brief-row .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brief-row .name{font-weight:600;font-size:1rem}
.brief-row .meta{color:var(--muted);font-size:.8rem;margin-top:4px}
.brief-row .badges{display:flex;gap:6px;align-items:center}

/* Detail panel */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;opacity:0;transition:opacity .3s}
.panel-overlay.open{display:flex;opacity:1}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(600px,100vw);background:var(--card);border-left:1px solid var(--border);z-index:101;overflow-y:auto;transform:translateX(100%);transition:transform .3s}
.panel.open{transform:none}
.panel-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2}
.panel-header h2{font-size:1.1rem}
.close-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text)}
.panel-body{padding:24px}

/* Section */
.section{margin-bottom:24px}
.section h3{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.section .row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem;border-bottom:1px solid var(--border)}
.section .row:last-child{border-bottom:none}
.section .row .k{color:var(--muted)}
.section .row .v{font-weight:500;text-align:right;max-width:60%;word-break:break-word}

/* Status select */
.status-select{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text);cursor:pointer}

/* Chat in panel */
.panel-chat{border-top:1px solid var(--border);margin-top:24px}
.panel-chat-header{padding:16px 0;font-weight:600;font-size:.9rem}
.panel-chat-messages{max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:.85rem;line-height:1.4}
.chat-msg.client{background:var(--primary-light);align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg.owner{background:var(--bg);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg .meta{font-size:.7rem;color:var(--muted);margin-top:3px}
.chat-input{display:flex;gap:8px;margin-top:8px}
.chat-input input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text)}
.chat-input input:focus{outline:none;border-color:var(--primary)}

/* Brief data display */
.data-block{background:var(--bg);padding:14px 18px;border-radius:8px;margin-bottom:8px;font-size:.85rem}
.data-block .key{font-weight:600;margin-bottom:2px}
.data-block .val{color:var(--muted)}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;font:inherit;font-size:.8rem;cursor:pointer;color:var(--muted);transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}

/* Copy link */
.copy-wrap{display:flex;gap:8px;align-items:center;margin-top:8px}
.copy-wrap input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:.8rem;background:var(--bg);color:var(--text)}

/* Empty state */
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty .icon{font-size:3rem;margin-bottom:16px}

/* Responsive */
@media(max-width:600px){
  .brief-row{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<!-- Login -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Admin Panel</h1>
    <p>Enter your dashboard key to access client briefs</p>
    <input type="password" id="keyInput" placeholder="Dashboard key" autofocus onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button>
    <p id="loginError" style="color:var(--error);margin-top:12px;font-size:.85rem;display:none"></p>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="topbar">
    <h1>Client Briefs</h1>
    <div class="actions">
      <button class="btn btn-ghost btn-sm" onclick="copyNewLink()">New Brief Link</button>
      <button class="btn btn-ghost btn-sm" onclick="loadBriefs()">Refresh</button>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="container">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div class="brief-list" id="briefList"></div>
  </div>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <h2 id="panelTitle">Brief Details</h2>
    <button class="close-btn" onclick="closePanel()">×</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
const API = '/api';
let KEY = '';
let briefs = [];
let filter = 'all';

function api(method, path, body) {
  const opts = { method, headers: { 'X-Dash-Key': KEY } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch(`${API}/${path}`, opts).then(r => r.json());
}

async function login() {
  KEY = document.getElementById('keyInput').value.trim();
  if (!KEY) return;
  const r = await api('GET', 'briefs');
  if (!r.ok) {
    document.getElementById('loginError').textContent = r.error || 'Invalid key';
    document.getElementById('loginError').style.display = 'block';
    KEY = '';
    return;
  }
  sessionStorage.setItem('bb_key', KEY);
  briefs = r.briefs || [];
  showApp();
}

function logout() { KEY = ''; sessionStorage.removeItem('bb_key'); location.reload(); }

function showApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderStats();
  renderFilters();
  renderList();
}

async function loadBriefs() {
  const r = await api('GET', 'briefs');
  if (r.ok) { briefs = r.briefs || []; renderStats(); renderList(); }
}

// --- Stats ---
function renderStats() {
  const total = briefs.length;
  const submitted = briefs.filter(b => b.status === 'submitted').length;
  const building = briefs.filter(b => b.status === 'building').length;
  const ready = briefs.filter(b => b.status === 'ready').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">Total Briefs</div></div>
    <div class="stat"><div class="num">${submitted}</div><div class="label">Awaiting Review</div></div>
    <div class="stat"><div class="num">${building}</div><div class="label">In Progress</div></div>
    <div class="stat"><div class="num">${ready}</div><div class="label">Completed</div></div>
  `;
}

// --- Filters ---
const STATUSES = ['all','draft','submitted','reviewing','building','client_review','ready','archived'];
const STATUS_LABELS = { all:'All', draft:'Draft', submitted:'Submitted', reviewing:'Reviewing', building:'Building', client_review:'Client Review', ready:'Ready', archived:'Archived' };

function renderFilters() {
  document.getElementById('filters').innerHTML = STATUSES.map(s =>
    `<button class="filter-btn${filter===s?' active':''}" onclick="setFilter('${s}')">${STATUS_LABELS[s]} ${s==='all'?`(${briefs.length})`:`(${briefs.filter(b=>b.status===s).length})`}</button>`
  ).join('');
}

function setFilter(f) { filter = f; renderFilters(); renderList(); }

// --- List ---
function renderList() {
  const list = document.getElementById('briefList');
  const filtered = filter === 'all' ? briefs : briefs.filter(b => b.status === filter);
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="icon">📋</div><h3>No briefs ${filter==='all'?'yet':'with this status'}</h3><p>Share a brief link with your clients to get started</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(b => `
    <div class="brief-row" onclick="openBrief('${b.id}')">
      <div>
        <div class="top">
          <span class="name">${esc(b.client_name || 'Unnamed')}</span>
          <span class="pill pill-${b.status}">${STATUS_LABELS[b.status] || b.status}</span>
        </div>
        <div class="meta">
          ${b.business_name ? esc(b.business_name) + ' · ' : ''}
          ${b.website_type ? esc(b.website_type) + ' · ' : ''}
          ${fmtDate(b.created_at)}
        </div>
      </div>
      <div class="badges">
        ${b.messages > 0 ? `<span class="pill pill-submitted">${b.messages} msg</span>` : ''}
        ${b.files > 0 ? `<span class="pill pill-building">${b.files} files</span>` : ''}
      </div>
    </div>
  `).join('');
}

// --- Detail panel ---
let currentBrief = null;

async function openBrief(id) {
  currentBrief = briefs.find(b => b.id === id);
  if (!currentBrief) return;

  const chatR = await api('GET', `chat?id=${id}`);
  const messages = chatR.ok ? chatR.messages : [];

  const b = currentBrief;
  const d = b.data || {};

  document.getElementById('panelTitle').textContent = b.client_name || 'Brief';

  const origin = location.origin;
  const clientLink = `${origin}/?token=${b.token}`;

  let dataHtml = '';
  const sections = {
    'Website Description': d.website_desc,
    'Services/Products': d.biz_services || d.shop_products || d.port_type || d.blog_topics || d.land_goal || d.comm_purpose || d.custom_desc,
    'Pages': Array.isArray(d.pages) ? d.pages.join(', ') : d.pages,
    'Features': Array.isArray(d.features) ? d.features.join(', ') : d.features,
    'Style': d.style,
    'Colors': d.colors,
    'Inspiration Sites': d.liked_sites,
    'Has Logo': d.has_logo,
    'Has Brand Guide': d.has_brand,
    'Content Ready': d.content_ready,
    'Has Images': d.has_images,
    'Budget': d.budget,
    'Timeline': d.timeline,
    'Additional Notes': d.final_notes || d.design_extra || d.content_extra || d.pages_extra,
  };
  for (const [k, v] of Object.entries(sections)) {
    if (v) dataHtml += `<div class="data-block"><div class="key">${k}</div><div class="val">${esc(String(v))}</div></div>`;
  }

  const typeSpecific = {};
  for (const [k, v] of Object.entries(d)) {
    if (k.startsWith('biz_') || k.startsWith('shop_') || k.startsWith('port_') || k.startsWith('blog_') || k.startsWith('land_') || k.startsWith('comm_') || k.startsWith('custom_')) {
      if (v && !Object.values(sections).includes(v)) {
        const label = k.replace(/^[a-z]+_/, '').replace(/_/g, ' ');
        typeSpecific[label] = Array.isArray(v) ? v.join(', ') : String(v);
      }
    }
  }
  for (const [k, v] of Object.entries(typeSpecific)) {
    dataHtml += `<div class="data-block"><div class="key">${k}</div><div class="val">${esc(v)}</div></div>`;
  }

  document.getElementById('panelBody').innerHTML = `
    <div class="section">
      <h3>Contact</h3>
      <div class="row"><span class="k">Name</span><span class="v">${esc(b.client_name)}</span></div>
      <div class="row"><span class="k">Email</span><span class="v">${esc(b.client_email)}</span></div>
      ${b.client_phone ? `<div class="row"><span class="k">Phone</span><span class="v">${esc(b.client_phone)}</span></div>` : ''}
      ${b.business_name ? `<div class="row"><span class="k">Business</span><span class="v">${esc(b.business_name)}</span></div>` : ''}
    </div>

    <div class="section">
      <h3>Status</h3>
      <select class="status-select" onchange="updateStatus('${b.id}',this.value)">
        ${['draft','submitted','reviewing','building','client_review','ready','archived'].map(s =>
          `<option value="${s}"${b.status===s?' selected':''}>${STATUS_LABELS[s]||s}</option>`
        ).join('')}
      </select>
    </div>

    <div class="section">
      <h3>Client Link</h3>
      <div class="copy-wrap">
        <input type="text" value="${clientLink}" readonly onclick="this.select()">
        <button class="btn btn-sm btn-ghost" onclick="copyText('${clientLink}')">Copy</button>
      </div>
    </div>

    <div class="section">
      <h3>Brief Details</h3>
      ${dataHtml || '<p style="color:var(--muted);font-size:.85rem">No data yet</p>'}
    </div>

    ${b.files > 0 ? `<div class="section"><h3>Files (${b.files})</h3><p style="font-size:.85rem;color:var(--muted)">Files can be downloaded from the API</p></div>` : ''}

    <div class="section">
      <h3>Actions</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-primary" onclick="generateSpec('${b.id}')">Send to Claude</button>
        <button class="btn btn-sm btn-ghost" onclick="exportBrief('${b.id}')">Export</button>
        <button class="btn btn-sm btn-danger" onclick="deleteBrief('${b.id}')">Delete</button>
      </div>
    </div>

    <div class="panel-chat">
      <div class="panel-chat-header">Chat with ${esc(b.client_name || 'Client')}</div>
      <div class="panel-chat-messages" id="panelMessages">
        ${messages.length === 0 ? '<p style="color:var(--muted);font-size:.85rem;padding:12px 0">No messages yet</p>' :
          messages.map(m => `<div class="chat-msg ${m.sender}"><div>${esc(m.text)}</div><div class="meta">${m.sender === 'owner' ? 'You' : 'Client'} · ${fmtDate(m.created_at)}</div></div>`).join('')}
      </div>
      <div class="chat-input">
        <input type="text" id="adminChatInput" placeholder="Reply to client..." onkeydown="if(event.key==='Enter')adminSendChat('${b.id}')">
        <button class="btn btn-sm btn-primary" onclick="adminSendChat('${b.id}')">Send</button>
      </div>
    </div>
  `;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  const mc = document.getElementById('panelMessages');
  if (mc) mc.scrollTop = mc.scrollHeight;
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  currentBrief = null;
}

async function updateStatus(id, status) {
  await api('PUT', `briefs?id=${id}`, { status });
  await loadBriefs();
}

async function adminSendChat(id) {
  const input = document.getElementById('adminChatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await api('POST', `chat?id=${id}`, { text });
  await openBrief(id);
}

async function deleteBrief(id) {
  if (!confirm('Delete this brief and all its data? This cannot be undone.')) return;
  await api('DELETE', `briefs?id=${id}`);
  closePanel();
  await loadBriefs();
}

function generateSpec(id) {
  const b = briefs.find(x => x.id === id);
  if (!b) return;
  const d = b.data || {};
  let spec = `Website Build Specification\n\nClient: ${b.client_name || '—'}\nBusiness: ${b.business_name || '—'}\nEmail: ${b.client_email || '—'}\nType: ${b.website_type || '—'}\n\n`;
  for (const [k, v] of Object.entries(d)) {
    if (v && k !== 'client_name' && k !== 'client_email' && k !== 'client_phone' && k !== 'business_name') {
      const label = k.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
      spec += `${label}: ${Array.isArray(v) ? v.join(', ') : v}\n`;
    }
  }
  spec += `\nBased on this brief, generate a detailed website build specification including:\n1. Recommended tech stack\n2. Page-by-page breakdown with content sections\n3. Feature implementation notes\n4. Design system recommendations\n5. Timeline estimate with milestones`;

  navigator.clipboard.writeText(spec).then(() => {
    alert('Build spec prompt copied to clipboard! Paste it into Claude to generate a detailed specification.');
  }).catch(() => {
    const w = window.open('', '_blank');
    w.document.write(`<pre style="white-space:pre-wrap;font-family:monospace;padding:20px">${esc(spec)}</pre>`);
  });
}

function exportBrief(id) {
  const b = briefs.find(x => x.id === id);
  if (!b) return;
  const blob = new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `brief-${b.client_name || b.id}.json`; a.click();
  URL.revokeObjectURL(url);
}

async function copyNewLink() {
  const origin = location.origin;
  const link = origin.replace('/admin.html', '/');
  await navigator.clipboard.writeText(link).catch(() => {});
  alert(`Brief form link copied:\n${link}\n\nShare this with your clients.`);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => alert('Copied!')).catch(() => {});
}

// --- Helpers ---
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// --- Auto-login from session ---
(function() {
  const saved = sessionStorage.getItem('bb_key');
  if (saved) { KEY = saved; api('GET', 'briefs').then(r => { if (r.ok) { briefs = r.briefs || []; showApp(); } }); }
})();
</script>
</body>
</html>
