<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief Builder — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fb;--card:#fff;--border:#e2e5ea;--text:#1a1d23;--muted:#6b7280;
  --primary:#2563eb;--primary-hover:#1d4ed8;--primary-light:#dbeafe;
  --success:#059669;--success-bg:#d1fae5;--warn:#d97706;--warn-bg:#fef3c7;
  --error:#dc2626;--error-bg:#fee2e2;--info:#2563eb;--info-bg:#dbeafe;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1117;--card:#1a1d27;--border:#2d3140;--text:#e5e7eb;--muted:#9ca3af;
  --primary:#3b82f6;--primary-hover:#2563eb;--primary-light:#1e3a5f;
  --success:#10b981;--success-bg:#064e3b;--warn:#f59e0b;--warn-bg:#78350f;
  --error:#ef4444;--error-bg:#7f1d1d;--info:#3b82f6;--info-bg:#1e3a5f;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow)}
.login-card h1{font-size:1.5rem;margin-bottom:8px}
.login-card p{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.login-card input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--bg);color:var(--text);margin-bottom:16px}
.login-card input:focus{outline:none;border-color:var(--primary)}

.app{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.topbar h1{font-size:1.15rem;white-space:nowrap}
.search-wrap{flex:1;min-width:180px;max-width:400px;position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text)}
.search-wrap input:focus{outline:none;border-color:var(--primary)}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.topbar .actions{display:flex;gap:6px;align-items:center;margin-left:auto}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.stat:hover{border-color:var(--primary)}
.stat.active{border-color:var(--primary);background:var(--primary-light)}
.stat .num{font-size:1.75rem;font-weight:700;line-height:1}
.stat .label{color:var(--muted);font-size:.8rem;margin-top:2px}

.btn{padding:8px 16px;border-radius:8px;font:inherit;font-weight:600;font-size:.8rem;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-sm{padding:5px 12px;font-size:.75rem}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--error);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-warn{background:var(--warn);color:#fff}

.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pill-draft{background:var(--border);color:var(--muted)}
.pill-submitted{background:var(--info-bg);color:var(--info)}
.pill-reviewing{background:var(--warn-bg);color:var(--warn)}
.pill-building{background:var(--primary-light);color:var(--primary)}
.pill-client_review{background:var(--warn-bg);color:var(--warn)}
.pill-ready{background:var(--success-bg);color:var(--success)}
.pill-archived{background:var(--border);color:var(--muted)}

.controls{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.filter-btn{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;font:inherit;font-size:.78rem;cursor:pointer;color:var(--muted);transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.sort-select{padding:5px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.78rem;background:var(--bg);color:var(--text);cursor:pointer}

.brief-list{display:flex;flex-direction:column;gap:10px}
.brief-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.brief-row:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(37,99,235,.1)}
.brief-row .name{font-weight:600;font-size:.95rem}
.brief-row .details{color:var(--muted);font-size:.78rem;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.brief-row .details span{display:inline-flex;align-items:center;gap:3px}
.brief-row .details span+span::before{content:'·';margin-right:4px}
.brief-row .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:600}
.badge-msg{background:var(--info-bg);color:var(--info)}
.badge-files{background:var(--success-bg);color:var(--success)}
.badge-unread{background:var(--error-bg);color:var(--error)}

.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;opacity:0;transition:opacity .3s}
.panel-overlay.open{display:flex;opacity:1}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);background:var(--card);border-left:1px solid var(--border);z-index:101;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2}
.panel-header h2{font-size:1.05rem;display:flex;align-items:center;gap:10px}
.close-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text)}
.panel-body{padding:20px}

.quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}

.section{margin-bottom:20px}
.section-header{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.section .row{display:flex;padding:5px 0;font-size:.85rem;gap:8px}
.section .row .k{color:var(--muted);min-width:110px;flex-shrink:0;font-size:.8rem}
.section .row .v{font-weight:500;word-break:break-word;flex:1}
.section .row .v.list{display:flex;flex-wrap:wrap;gap:4px}
.section .row .v .tag{display:inline-block;padding:1px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:.78rem;font-weight:500}

.status-select{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text);cursor:pointer}

.notes-area{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text);resize:vertical;min-height:80px}
.notes-area:focus{outline:none;border-color:var(--primary)}

.link-bar{display:flex;gap:6px;align-items:center}
.link-bar input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:.78rem;background:var(--bg);color:var(--text)}

.file-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:.82rem}
.file-row .fname{font-weight:500;flex:1;word-break:break-all}
.file-row .fsize{color:var(--muted);white-space:nowrap}

.panel-chat{border-top:1px solid var(--border);margin-top:20px;padding-top:16px}
.panel-chat-header{font-weight:600;font-size:.9rem;margin-bottom:10px}
.panel-chat-messages{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:.82rem;line-height:1.4}
.chat-msg.client{background:var(--primary-light);align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg.owner{background:var(--bg);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--border)}
.chat-msg .meta{font-size:.68rem;color:var(--muted);margin-top:3px}
.chat-input{display:flex;gap:6px;margin-top:8px}
.chat-input input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text)}
.chat-input input:focus{outline:none;border-color:var(--primary)}

.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty .icon{font-size:3rem;margin-bottom:12px}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:var(--success);color:#fff;border-radius:8px;font-size:.85rem;font-weight:500;z-index:200;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}

@media(max-width:600px){
  .topbar{padding:10px 14px;gap:10px}
  .topbar h1{font-size:1rem}
  .search-wrap{min-width:140px}
  .brief-row{grid-template-columns:1fr;gap:8px;padding:14px 16px}
  .brief-row .right{justify-content:flex-start}
  .stats{grid-template-columns:repeat(2,1fr)}
  .panel{width:100vw}
  .panel-body{padding:16px}
  .quick-actions{gap:4px}
  .section .row{flex-direction:column;gap:2px}
  .section .row .k{min-width:auto}
  .controls{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Admin Panel</h1>
    <p>Enter your dashboard key to manage client briefs</p>
    <input type="password" id="keyInput" placeholder="Dashboard key" autofocus onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button>
    <p id="loginError" style="color:var(--error);margin-top:12px;font-size:.85rem;display:none"></p>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <h1>Client Briefs</h1>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search by name, email, business..." oninput="onSearch()">
    </div>
    <div class="actions">
      <button class="btn btn-primary btn-sm" onclick="copyNewLink()">+ New Link</button>
      <button class="btn btn-ghost btn-sm" onclick="loadBriefs()">Refresh</button>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="container">
    <div class="stats" id="stats"></div>
    <div class="controls">
      <div class="filters" id="filters"></div>
      <select class="sort-select" id="sortSelect" onchange="onSort()">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="updated">Recently updated</option>
        <option value="name">Name A-Z</option>
      </select>
    </div>
    <div class="brief-list" id="briefList"></div>
  </div>
</div>

<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <h2 id="panelTitle">Brief Details</h2>
    <button class="close-btn" onclick="closePanel()">&#x2715;</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
let KEY = '';
let briefs = [];
let filter = 'all';
let searchQuery = '';
let sortOrder = 'newest';
let currentBrief = null;

const STATUS_LABELS = { all:'All', draft:'Draft', submitted:'New', reviewing:'Reviewing', building:'Building', client_review:'Client Review', ready:'Completed', archived:'Archived' };
const STATUSES = Object.keys(STATUS_LABELS);
const TYPE_LABELS = { business:'Business / Company', ecommerce:'Online Store', portfolio:'Portfolio', blog:'Blog / Magazine', landing:'Landing Page', community:'Community / Forum', other:'Custom / Other' };
const STYLE_LABELS = { modern:'Modern & Minimal', bold:'Bold & Colorful', elegant:'Classic & Elegant', playful:'Playful & Fun', corporate:'Corporate & Professional' };

function api(method, path, body) {
  const opts = { method, headers: { 'X-Dash-Key': KEY } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch(`${API}/${path}`, opts).then(r => r.json());
}

async function login() {
  KEY = document.getElementById('keyInput').value.trim();
  if (!KEY) return;
  const r = await api('GET', 'briefs');
  if (!r.ok) {
    document.getElementById('loginError').textContent = r.error || 'Invalid key';
    document.getElementById('loginError').style.display = 'block';
    KEY = '';
    return;
  }
  sessionStorage.setItem('bb_key', KEY);
  briefs = r.briefs || [];
  showApp();
}

function logout() { KEY = ''; sessionStorage.removeItem('bb_key'); location.reload(); }

function showApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderAll();
}

async function loadBriefs() {
  const r = await api('GET', 'briefs');
  if (r.ok) { briefs = r.briefs || []; renderAll(); }
}

function renderAll() { renderStats(); renderFilters(); renderList(); }

function getFiltered() {
  let list = briefs;
  if (filter !== 'all') list = list.filter(b => b.status === filter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(b =>
      (b.client_name || '').toLowerCase().includes(q) ||
      (b.client_email || '').toLowerCase().includes(q) ||
      (b.business_name || '').toLowerCase().includes(q) ||
      (b.website_type || '').toLowerCase().includes(q) ||
      (b.client_phone || '').includes(q)
    );
  }
  if (sortOrder === 'newest') list.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
  else if (sortOrder === 'oldest') list.sort((a, b) => (a.created_at || 0) - (b.created_at || 0));
  else if (sortOrder === 'updated') list.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
  else if (sortOrder === 'name') list.sort((a, b) => (a.client_name || '').localeCompare(b.client_name || ''));
  return list;
}

function onSearch() { searchQuery = document.getElementById('searchInput').value.trim(); renderList(); }
function onSort() { sortOrder = document.getElementById('sortSelect').value; renderList(); }

function renderStats() {
  const counts = { all: briefs.length };
  STATUSES.forEach(s => { if (s !== 'all') counts[s] = briefs.filter(b => b.status === s).length; });
  const tiles = [
    { key: 'all', label: 'Total', color: '' },
    { key: 'submitted', label: 'Awaiting Review', color: 'var(--info)' },
    { key: 'building', label: 'In Progress', color: 'var(--primary)' },
    { key: 'ready', label: 'Completed', color: 'var(--success)' },
  ];
  document.getElementById('stats').innerHTML = tiles.map(t =>
    `<div class="stat${filter === t.key ? ' active' : ''}" onclick="setFilter('${t.key}')">
      <div class="num" ${t.color ? `style="color:${t.color}"` : ''}>${counts[t.key] || 0}</div>
      <div class="label">${t.label}</div>
    </div>`
  ).join('');
}

function renderFilters() {
  document.getElementById('filters').innerHTML = STATUSES.map(s => {
    const cnt = s === 'all' ? briefs.length : briefs.filter(b => b.status === s).length;
    if (cnt === 0 && s !== 'all' && s !== filter) return '';
    return `<button class="filter-btn${filter === s ? ' active' : ''}" onclick="setFilter('${s}')">${STATUS_LABELS[s]} (${cnt})</button>`;
  }).join('');
}

function setFilter(f) { filter = f; renderAll(); }

function renderList() {
  const list = document.getElementById('briefList');
  const filtered = getFiltered();
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="icon">${searchQuery ? '🔍' : '📋'}</div>
      <h3>${searchQuery ? 'No results found' : (filter === 'all' ? 'No briefs yet' : 'No briefs with this status')}</h3>
      <p>${searchQuery ? 'Try a different search' : 'Share a brief link with your clients to get started'}</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(b => {
    const hasUnread = b.messages > 0;
    return `<div class="brief-row" onclick="openBrief('${b.id}')">
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="name">${esc(b.client_name || 'Unnamed')}</span>
          <span class="pill pill-${b.status}">${STATUS_LABELS[b.status] || b.status}</span>
        </div>
        <div class="details">
          ${b.client_email ? `<span>${esc(b.client_email)}</span>` : ''}
          ${b.business_name ? `<span>${esc(b.business_name)}</span>` : ''}
          ${b.website_type ? `<span>${esc(TYPE_LABELS[b.website_type] || b.website_type)}</span>` : ''}
          <span>${fmtDate(b.created_at)}</span>
        </div>
      </div>
      <div class="right">
        ${b.messages > 0 ? `<span class="badge badge-msg">${b.messages} msg</span>` : ''}
        ${b.files > 0 ? `<span class="badge badge-files">${b.files} files</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function openBrief(id) {
  currentBrief = briefs.find(b => b.id === id);
  if (!currentBrief) return;

  const [chatR, uploadsR] = await Promise.all([
    api('GET', `chat?id=${id}`),
    api('GET', `briefs`),
  ]);
  const messages = chatR.ok ? chatR.messages : [];

  const b = currentBrief;
  const d = b.data || {};
  const origin = location.origin;
  const clientLink = `${origin}/?token=${b.token}`;

  document.getElementById('panelTitle').innerHTML = `${esc(b.client_name || 'Brief')} <span class="pill pill-${b.status}">${STATUS_LABELS[b.status] || b.status}</span>`;

  let html = '';

  // Quick actions
  html += `<div class="quick-actions">
    <button class="btn btn-sm btn-primary" onclick="copyClientLink('${b.token}')">Copy Link</button>
    <button class="btn btn-sm btn-success" onclick="sendLinkToClient('${b.id}')">Email Link to Client</button>
    ${b.client_phone ? `<button class="btn btn-sm btn-ghost" onclick="openWhatsApp('${esc(b.client_phone)}','${b.token}')">WhatsApp</button>` : ''}
    <button class="btn btn-sm btn-ghost" onclick="generateSpec('${b.id}')">Send to Claude</button>
    <button class="btn btn-sm btn-ghost" onclick="exportBrief('${b.id}')">Export JSON</button>
    <button class="btn btn-sm btn-danger" onclick="deleteBrief('${b.id}')">Delete</button>
  </div>`;

  // Client link
  html += `<div class="section">
    <div class="section-header">Client Link</div>
    <div class="link-bar">
      <input type="text" value="${clientLink}" readonly onclick="this.select()">
      <button class="btn btn-sm btn-ghost" onclick="copyClientLink('${b.token}')">Copy</button>
    </div>
  </div>`;

  // Status
  html += `<div class="section">
    <div class="section-header">Status</div>
    <select class="status-select" onchange="updateStatus('${b.id}',this.value)">
      ${['draft','submitted','reviewing','building','client_review','ready','archived'].map(s =>
        `<option value="${s}"${b.status===s?' selected':''}>${STATUS_LABELS[s]||s}</option>`
      ).join('')}
    </select>
    <span style="margin-left:12px;font-size:.78rem;color:var(--muted)">Created: ${fmtDateFull(b.created_at)}${b.submitted_at ? ' | Submitted: ' + fmtDateFull(b.submitted_at) : ''}</span>
  </div>`;

  // Contact info
  html += `<div class="section">
    <div class="section-header">Contact Information</div>
    ${row('Name', b.client_name)}
    ${row('Email', b.client_email)}
    ${row('Phone', b.client_phone)}
    ${row('Business', b.business_name)}
  </div>`;

  // Website type
  const typeName = TYPE_LABELS[d.website_type || b.website_type] || d.website_type || b.website_type;
  html += `<div class="section">
    <div class="section-header">Website Type</div>
    ${row('Type', typeName)}
    ${row('Description', d.website_desc)}
  </div>`;

  // Type-specific details
  const typeKey = d.website_type || b.website_type || '';
  let typeHtml = '';
  if (typeKey === 'business') {
    typeHtml = row('Services/Products', d.biz_services) + row('Locations', d.biz_locations) + tagRow('Features', d.biz_features) + row('Extra Notes', d.biz_extra);
  } else if (typeKey === 'ecommerce') {
    typeHtml = row('Products', d.shop_products) + row('Product Count', d.shop_count) + tagRow('Features', d.shop_features) + row('Extra Notes', d.shop_extra);
  } else if (typeKey === 'portfolio') {
    typeHtml = row('Work Type', d.port_type) + row('Item Count', d.port_count) + tagRow('Features', d.port_features) + row('Extra Notes', d.port_extra);
  } else if (typeKey === 'blog') {
    typeHtml = row('Topics', d.blog_topics) + row('Frequency', d.blog_frequency) + tagRow('Features', d.blog_features) + row('Extra Notes', d.blog_extra);
  } else if (typeKey === 'landing') {
    typeHtml = row('Goal', d.land_goal) + tagRow('Features', d.land_features) + row('Extra Notes', d.land_extra);
  } else if (typeKey === 'community') {
    typeHtml = row('Purpose', d.comm_purpose) + tagRow('Features', d.comm_features) + row('Extra Notes', d.comm_extra);
  } else if (typeKey === 'other') {
    typeHtml = row('Description', d.custom_desc) + row('Examples', d.custom_examples) + row('Extra', d.custom_extra);
  }
  if (typeHtml) {
    html += `<div class="section"><div class="section-header">${esc(typeName || 'Type')} Details</div>${typeHtml}</div>`;
  }

  // Pages & features
  html += `<div class="section">
    <div class="section-header">Pages &amp; Features</div>
    ${tagRow('Pages', d.pages)}
    ${tagRow('Features', d.features)}
    ${row('Additional', d.pages_extra)}
  </div>`;

  // Design
  html += `<div class="section">
    <div class="section-header">Design Preferences</div>
    ${row('Style', STYLE_LABELS[d.style] || d.style)}
    ${row('Colors', d.colors)}
    ${row('Inspiration Sites', d.liked_sites)}
    ${row('Has Logo', d.has_logo)}
    ${row('Brand Guidelines', d.has_brand)}
    ${row('Design Notes', d.design_extra)}
  </div>`;

  // Content
  html += `<div class="section">
    <div class="section-header">Content &amp; Media</div>
    ${row('Content Ready', d.content_ready)}
    ${row('Has Images', d.has_images)}
    ${row('Content Notes', d.content_extra)}
  </div>`;

  // Files
  const uploads = (await api('GET', `briefs`)).briefs?.find(x => x.id === b.id);
  if (b.files > 0) {
    const fileList = (await env_uploads(b.id));
    html += `<div class="section">
      <div class="section-header">Uploaded Files (${b.files})</div>
      <div id="filesList">Loading files...</div>
    </div>`;
  }

  // Budget & timeline
  html += `<div class="section">
    <div class="section-header">Budget &amp; Timeline</div>
    ${row('Budget', d.budget)}
    ${row('Timeline', d.timeline)}
    ${row('Final Notes', d.final_notes)}
  </div>`;

  // Admin notes
  const notes = d.admin_notes || '';
  html += `<div class="section">
    <div class="section-header">Admin Notes</div>
    <textarea class="notes-area" id="adminNotes" placeholder="Add internal notes about this brief...">${esc(notes)}</textarea>
    <button class="btn btn-sm btn-ghost" style="margin-top:6px" onclick="saveNotes('${b.id}')">Save Notes</button>
  </div>`;

  // Chat
  html += `<div class="panel-chat">
    <div class="panel-chat-header">Chat with ${esc(b.client_name || 'Client')} ${messages.length > 0 ? `(${messages.length})` : ''}</div>
    <div class="panel-chat-messages" id="panelMessages">
      ${messages.length === 0 ? '<p style="color:var(--muted);font-size:.85rem;padding:16px 0;text-align:center">No messages yet</p>' :
        messages.map(m => `<div class="chat-msg ${m.sender}"><div>${esc(m.text)}</div><div class="meta">${m.sender === 'owner' ? 'You' : 'Client'} &middot; ${fmtDateFull(m.created_at)}</div></div>`).join('')}
    </div>
    <div class="chat-input">
      <input type="text" id="adminChatInput" placeholder="Reply to client..." onkeydown="if(event.key==='Enter')adminSendChat('${b.id}')">
      <button class="btn btn-sm btn-primary" onclick="adminSendChat('${b.id}')">Send</button>
    </div>
  </div>`;

  document.getElementById('panelBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  const mc = document.getElementById('panelMessages');
  if (mc) mc.scrollTop = mc.scrollHeight;

  loadFiles(b.id);
}

async function loadFiles(briefId) {
  const el = document.getElementById('filesList');
  if (!el) return;
  try {
    const brief = briefs.find(b => b.id === briefId);
    if (!brief || brief.files === 0) { el.innerHTML = '<p style="color:var(--muted);font-size:.82rem">No files</p>'; return; }
    el.innerHTML = `<p style="color:var(--muted);font-size:.82rem">${brief.files} file(s) uploaded. Use the API to download: <code>GET /api/upload?id=FILE_ID</code></p>`;
  } catch { el.innerHTML = ''; }
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  currentBrief = null;
}

function row(label, value) {
  if (!value) return '';
  return `<div class="row"><span class="k">${label}</span><span class="v">${esc(String(value))}</span></div>`;
}

function tagRow(label, arr) {
  if (!arr || !Array.isArray(arr) || arr.length === 0) return '';
  return `<div class="row"><span class="k">${label}</span><span class="v list">${arr.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</span></div>`;
}

async function updateStatus(id, status) {
  await api('PUT', `briefs?id=${id}`, { status });
  await loadBriefs();
  if (currentBrief && currentBrief.id === id) {
    currentBrief = briefs.find(b => b.id === id);
    if (currentBrief) openBrief(id);
  }
  toast('Status updated');
}

async function saveNotes(id) {
  const text = document.getElementById('adminNotes')?.value || '';
  await api('PUT', `briefs?id=${id}`, { notes: text });
  toast('Notes saved');
}

async function adminSendChat(id) {
  const input = document.getElementById('adminChatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await api('POST', `chat?id=${id}`, { text });
  await openBrief(id);
}

async function deleteBrief(id) {
  if (!confirm('Delete this brief and all its data? This cannot be undone.')) return;
  await api('DELETE', `briefs?id=${id}`);
  closePanel();
  await loadBriefs();
  toast('Brief deleted');
}

function copyClientLink(token) {
  const link = `${location.origin}/?token=${token}`;
  navigator.clipboard.writeText(link).then(() => toast('Link copied!')).catch(() => {
    prompt('Copy this link:', link);
  });
}

async function sendLinkToClient(id) {
  const b = briefs.find(x => x.id === id);
  if (!b || !b.client_email) { toast('No email on file'); return; }
  if (!confirm(`Send brief link to ${b.client_email}?`)) return;
  const r = await fetch(`${API}/recover?id=${id}`, {
    method: 'POST',
    headers: { 'X-Dash-Key': KEY, 'Content-Type': 'application/json' },
    body: '{}',
  }).then(r => r.json());
  if (r.ok) {
    toast(r.sent ? 'Link emailed to client!' : 'Link generated (email not configured — copy link instead)');
  } else {
    toast(r.error || 'Failed');
  }
}

function openWhatsApp(phone, token) {
  const link = `${location.origin}/?token=${token}`;
  const text = encodeURIComponent(`Here is your brief link: ${link}`);
  const clean = phone.replace(/[^0-9+]/g, '');
  window.open(`https://wa.me/${clean}?text=${text}`, '_blank');
}

function generateSpec(id) {
  const b = briefs.find(x => x.id === id);
  if (!b) return;
  const d = b.data || {};
  let spec = `Website Build Specification\n\nClient: ${b.client_name || ''}\nBusiness: ${b.business_name || ''}\nEmail: ${b.client_email || ''}\nType: ${TYPE_LABELS[b.website_type] || b.website_type || ''}\n\n`;
  const skip = new Set(['client_name','client_email','client_phone','business_name','admin_notes']);
  for (const [k, v] of Object.entries(d)) {
    if (v && !skip.has(k)) {
      const label = k.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
      spec += `${label}: ${Array.isArray(v) ? v.join(', ') : v}\n`;
    }
  }
  spec += `\nBased on this brief, generate a detailed website build specification including:\n1. Recommended tech stack\n2. Page-by-page breakdown with content sections\n3. Feature implementation notes\n4. Design system recommendations\n5. Timeline estimate with milestones`;
  navigator.clipboard.writeText(spec).then(() => toast('Build spec copied to clipboard!')).catch(() => {
    const w = window.open('', '_blank');
    if (w) w.document.write(`<pre style="white-space:pre-wrap;font-family:monospace;padding:20px">${esc(spec)}</pre>`);
  });
}

function exportBrief(id) {
  const b = briefs.find(x => x.id === id);
  if (!b) return;
  const blob = new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `brief-${(b.client_name || b.id).replace(/[^a-z0-9]/gi,'_')}.json`; a.click();
  URL.revokeObjectURL(url);
}

async function copyNewLink() {
  const link = location.origin + '/';
  await navigator.clipboard.writeText(link).catch(() => {});
  toast('Brief form link copied!');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtDateFull(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

(function() {
  const saved = sessionStorage.getItem('bb_key');
  if (saved) { KEY = saved; api('GET', 'briefs').then(r => { if (r.ok) { briefs = r.briefs || []; showApp(); } }); }
})();
</script>
